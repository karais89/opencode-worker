name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive reviewed source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: reviewed-source
          path: source.zip
          retention-days: 1
      - name: Python syntax
        run: python -m compileall -q scripts
      - name: Python regression tests (no provider calls)
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Shared bundle installation tests (no provider calls)
        run: python -m unittest discover -s . -p "test_install.py" -v
      - name: JavaScript syntax
        run: node --check assets/submit-result.mjs
